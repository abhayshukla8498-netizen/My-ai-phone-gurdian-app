name: Build APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1. Zip file ko perfectly extract karna
      - name: Unzip Project Perfectly
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project
          echo "Unzip completed successfully."

      # 2. Corrupt jar hatana par baaki files safe rakhna
      - name: Carefully Remove Only Corrupt Jar File
        run: |
          cd extracted_project
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -rf .gradle

      # 3. Ek naya fresh debug keystore automatic generate karna taaki signing error na aaye
      - name: Generate Fresh Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # 4. System gradle se build karna bina kisi signing block ke
      - name: Build APK Directly with System Gradle
        run: |
          cd extracted_project
          gradle assembleDebug --no-daemon

      # 5. Final APK ko nikalna
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abhay-AI-Debug-APK
          path: 'extracted_project/**/build/outputs/apk/debug/*.apk'
