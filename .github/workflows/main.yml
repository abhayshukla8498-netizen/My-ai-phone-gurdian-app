name: Build APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip Project Perfectly
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project
          echo "Unzip completed successfully."

      # Yeh step aapki corrupt gradle file ko hatakar nayi fresh file banayega
      - name: Fix Corrupt Gradle Wrapper
        run: |
          cd extracted_project
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.2

      - name: Grant execute permission for gradlew
        run: |
          cd extracted_project
          chmod +x gradlew
        continue-on-error: true

      - name: Build APK with Gradle
        run: |
          cd extracted_project
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abhay-AI-Debug-APK
          path: 'extracted_project/**/build/outputs/apk/debug/*.apk'
