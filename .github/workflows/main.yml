name: Build APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Java 17 setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Android SDK setup (Yeh aapke environment ko automatic standard studio jaisa bana dega)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Zip file extraction (bina kisi name conflict ke)
      - name: Unzip Project Perfectly
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project
          echo "Unzip completed successfully."

      # Purani corrupt files ko hatana
      - name: Clean Gradle Wrapper Files
        run: |
          cd extracted_project
          rm -rf .gradle gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties

      # Is baar hum standard command ka use karenge bina custom user_home ke, jo environment ko handle karega
      - name: Build APK with Production Command
        run: |
          cd extracted_project
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abhay-AI-Debug-APK
          path: 'extracted_project/**/build/outputs/apk/debug/*.apk'
