name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1. Zip file ko extract karna
      - name: Unzip Project Perfectly
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project

      # 2. Corrupt jar hatana par baaki files safe rakhna
      - name: Carefully Remove Only Corrupt Jar File
        run: |
          cd extracted_project
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -rf .gradle

      # 3. Cloud par hi Samsung Store ke liye Real Release Key generate karna
      - name: Generate Production Release Keystore
        run: |
          cd extracted_project
          keytool -genkey -v -keystore release.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} -alias ${{ secrets.KEY_ALIAS }} -keypass ${{ secrets.KEY_PASSWORD }} -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Abhay Shukla,O=AbhayAI,C=IN"

      # 4. Release APK build karna automatic signing ke sath
      - name: Build Signed Release APK
        run: |
          cd extracted_project
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon

      # 5. Final Signed APK ko upload karna
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Abhay-AI-Samsung-Release-APK
          path: 'extracted_project/**/build/outputs/apk/release/*.apk'
