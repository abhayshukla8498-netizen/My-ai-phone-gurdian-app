name: Build APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Zip file ko perfectly extract karne ke liye
      - name: Unzip Project Perfectly
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project
          echo "Unzip completed successfully."

      # Fresh wrapper generator bina kisi purani corrupt file ke
      - name: Fix Corrupt Gradle Wrapper
        run: |
          cd extracted_project
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.2

      # Is baar hum Gradle ki cache directory hi badal rahe hain taaki jar corruption error aaye hi na
      - name: Build APK with Clean Cache
        run: |
          cd extracted_project
          chmod +x gradlew
          mkdir -p custom_gradle_user_home
          export GRADLE_USER_HOME=$(pwd)/custom_gradle_user_home
          ./gradlew clean assembleDebug --no-configuration-cache --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abhay-AI-Debug-APK
          path: 'extracted_project/**/build/outputs/apk/debug/*.apk'
