name: Check Zip Structure

on:
  workflow_dispatch:

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: List Root Files
        run: ls -la

      - name: Unzip and List Everything
        run: |
          mkdir -p test_folder
          unzip *.zip -d test_folder || echo "Zip extract me dikkat aayi"
          echo "--- Zip ke andar ye saari files hain: ---"
          find test_folder -maxdepth 3
          
