name: Build APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. Zip file ko perfectly extract karna
      - name: Unzip Project Perfectly
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project
          echo "Unzip completed successfully."

      # 2. Corrupt wrapper file hatana aur baaki sab safe rakhna
      - name: Carefully Remove Only Corrupt Jar File
        run: |
          cd extracted_project
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -rf .gradle

      # 3. Direct project folder ke andar debug.keystore generate karna
      - name: Generate Custom Debug Keystore
        run: |
          cd extracted_project
          keytool -genkey -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # 4. Gradle ko custom keystore path dene ke liye force karna aur build karna
      - name: Build APK Directly with System Gradle
        run: |
          cd extracted_project
          gradle assembleDebug -Pandroid.injected.signing.store.file=$(pwd)/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android --no-daemon

      # 5. Final APK ko nikalna
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abhay-AI-Debug-APK
          path: 'extracted_project/**/build/outputs/apk/debug/*.apk'
