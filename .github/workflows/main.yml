name: Build APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Zip file ko extract karna
      - name: Unzip Project Perfectly
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project
          echo "Unzip completed successfully."

      # Sabse professional aur foolproof build automation tool ka use karna
      - name: Run Android Build Action
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: extracted_project
          arguments: assembleDebug --no-configuration-cache --no-daemon
