name: Build APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1. Zip file ko perfectly extract karna
      - name: Unzip Project Perfectly
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project
          echo "Unzip completed successfully."

      # 2. SIRF aur SIRF corrupt jar file ko hatana (Baki references ko safe rakhna)
      - name: Carefully Remove Only Corrupt Jar File
        run: |
          cd extracted_project
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -rf .gradle

      # 3. System gradle se build karna bina kisi reference error ke
      - name: Build APK Directly with System Gradle
        run: |
          cd extracted_project
          gradle assembleDebug --no-daemon

      # 4. Final APK ko nikalna
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abhay-AI-Debug-APK
          path: 'extracted_project/**/build/outputs/apk/debug/*.apk'
