name: Build APK from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1. Zip file ko extract karna
      - name: Unzip Project Perfectly
        run: |
          mkdir -p extracted_project
          unzip -o "*.zip" -d extracted_project
          echo "Unzip completed successfully."

      # 2. Kisi bhi purani corrupt wrapper file ko delete karna
      - name: Remove Corrupt Wrapper Files
        run: |
          cd extracted_project
          rm -rf gradle/wrapper/gradle-wrapper.jar
          rm -rf .gradle

      # 3. System ke fresh gradle se build karna (Bina wrapper ke)
      - name: Build APK with Pre-installed Gradle
        run: |
          cd extracted_project
          gradle assembleDebug --no-daemon --stacktrace

      # 4. APK ko upload karna taaki aap download kar sakein
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abhay-AI-Debug-APK
          path: 'extracted_project/**/build/outputs/apk/debug/*.apk'
          
